version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docusense_qdrant
    volumes:
      - ./qdrant_data:/qdrant/storage
    ports:
      # host-port:container-port
      - "127.0.0.1:6333:6333"

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-docusense}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local-dev-only}
      - POSTGRES_DB=${POSTGRES_DB:-docusense}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      # dockerfile: backend/Dockerfile
    container_name: docusense_backend
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-docusense}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local-dev-only}
      - POSTGRES_DB=${POSTGRES_DB:-docusense}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}
      - BACKEND_ORIGIN=${BACKEND_ORIGIN:-http://localhost:8000}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    # Enable Live Watching for Backend
    develop:
      watch:
        # Sync Python files instantly into the container
        - path: ./backend
          action: sync+restart
          target: /app/backend
          ignore:
            - data/
        # Rebuild container only if dependencies change
        - path: ./backend/requirements-linux.txt
          action: rebuild

  frontend:
    build:
      context: ./frontend
      # dockerfile: frontend/Dockerfile
    container_name: docusense_frontend
    ports:
      - "5173:5173"
    # Enable Live Watching for Frontend
    develop:
      watch:
        # Sync React components instantly (Vite triggers live HMR)
        - path: ./frontend/src
          action: sync
          target: /app/src
        # Rebuild container only if package.json changes
        - path: ./frontend/package.json
          action: rebuild

volumes:
  postgres_data:
